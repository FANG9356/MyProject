<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nongfangsocute</title>
    <link rel="icon" type="image/png" href="picture/10766476.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #6d6767;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            background-color: #fff;
            color: rgb(116, 111, 111);
            overflow: hidden;
            animation: fadeIn 1s ease-out; 
        }
        .time-container {
            font-size: 7em;
            font-weight: bold;
            cursor: pointer; 
        }
        .date-container {
            font-size: 4em;
            margin-top: 10px;
            cursor: pointer; 
        }
             @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(50px); 
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div>
        <div class="time-container" id="current-time"></div>
        <div class="date-container" id="current-date"></div>
    </div>
    <script>
        function updateTime() {
            const options = {
                timeZone: 'Asia/Bangkok',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            const now = new Date();
            const time = now.toLocaleTimeString('en-GB', options); 
            document.getElementById('current-time').textContent = time;
            const dateOptions = { 
                timeZone: 'Asia/Bangkok',
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            };
            const date = now.toLocaleDateString('en-GB', dateOptions);
            document.getElementById('current-date').textContent = date;
        }
            setInterval(updateTime, 1000);
        updateTime(); 
                document.getElementById('current-time').addEventListener('click', function() {
            window.location.href = "Seniormath.html";
        });
        document.getElementById('current-date').addEventListener('click', function() {
            window.location.href = "Seniormath.html"; 
        });
    </script>
</body>
</html>
