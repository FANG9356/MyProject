<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seniormath Calculator</title>
    <link rel="icon" type="image/png" href="picture/10766476.png">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, #AB61E4, #7A8DF4);
        }
body {
    opacity: 0;
    transform: scale(0.95);
    transition: opacity 3s ease-out, transform 4s ease-out;
}
body.loaded {
    opacity: 1;
    transform: scale(1);
}
        .calculator-wrapper {
            width: 300px;
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin: auto 50px;
        }
        .title-wrapper {
            font-size: 24px;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
        }
        .display {
            width: 100%;
            height: 50px;
            font-size: 24px;
            text-align: right;
            padding-right: 10px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            margin-bottom: 15px;
        }
        .calculator-button-wrapper {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .calculator-button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
        }
        .calculator-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .clear-button {
            grid-column: span 2;
            background: rgba(255, 0, 0, 0.6);
        }
        .clear-button:hover {
            background: rgba(255, 0, 0, 0.8);
        }
        .paper-wrapper {
            flex: 1; 
            background: white;
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
            box-shadow: -5px 0px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .note-textarea {
            width: 90%;
            height: 80%;
            border: none;
            outline: none;
            font-size: 18px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(240, 240, 240, 0.8);
            resize: none;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
        }
.logo {
    position: absolute;
    top: -10px;  
    left: -30px; 
    width: 200px; 
    height: auto; 
    cursor: pointer;
    transition: transform 0.3s ease, opacity 0.3s ease;
}
.logo:hover {
    transform: scale(1.1);
    opacity: 0.8;
}
    </style>
</head>
<body>
<a href="Seniormath.html">
    <img src="picture/Screenshot 2025-01-24 162721-Photoroom.png" class="logo">
</a>
    <div class="calculator-wrapper">
        <div class="title-wrapper"></div>
        <input type="text" class="display" id="display" disabled>
        <div class="calculator-button-wrapper">
            <button class="calculator-button">7</button>
            <button class="calculator-button">8</button>
            <button class="calculator-button">9</button>
            <button class="calculator-button">/</button>
            <button class="calculator-button">4</button>
            <button class="calculator-button">5</button>
            <button class="calculator-button">6</button>
            <button class="calculator-button">*</button>
            <button class="calculator-button">1</button>
            <button class="calculator-button">2</button>
            <button class="calculator-button">3</button>
            <button class="calculator-button">-</button>
            <button class="calculator-button">0</button>
            <button class="calculator-button">.</button>
            <button class="calculator-button">=</button>
            <button class="calculator-button">+</button>
            <button class="calculator-button clear-button">C</button>
        </div>
    </div>
</a>
    <div class="paper-wrapper">
        <textarea class="note-textarea" placeholder="   "></textarea>
    </div>
    <script>
        const display = document.getElementById("display");
        const buttons = document.querySelectorAll(".calculator-button");
        let currentInput = "";
        buttons.forEach(button => {
            button.addEventListener("click", () => {
                const value = button.textContent;
                if (value === "=") {
                    try {
                        currentInput = eval(currentInput).toString();
                    } catch {
                        currentInput = "Error";
                    }
                } else if (value === "C") {
                    currentInput = "";
                } else {
                    currentInput += value;
                }
                display.value = currentInput;
            });
        });
        document.addEventListener("DOMContentLoaded", () => {
    document.body.classList.add("loaded");
});
    </script>
</body>
</html>
