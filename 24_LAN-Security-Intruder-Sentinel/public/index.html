<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Fang Security Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: 'JetBrains Mono', monospace; 
            padding: 20px; 
            max-width: 1200px; 
            margin: 0 auto;
        }

        .grid-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .grid-row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px; }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            display: flex; flex-direction: column; justify-content: center;
            position: relative; overflow: hidden;
            min-height: 100px;
        }

        .chart-container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            height: 300px;
        }

        .card h2 { margin: 0; font-size: 0.75rem; color: #8b949e; letter-spacing: 1px; text-transform: uppercase; }
        .value-large { font-size: 2rem; font-weight: bold; margin: 5px 0; }
        .unit { font-size: 0.7rem; color: #8b949e; }
        
        .color-dl { color: #58a6ff; }
        .color-ul { color: #ff7b72; }
        .color-wan { color: #2ea043; text-shadow: 0 0 10px rgba(46, 160, 67, 0.4); } /* เขียว */
        
        .color-cpu { color: #d29922; }
        .color-ram { color: #a371f7; }
        .color-disk { color: #f2cc60; }
        .color-uptime { color: #f0883e; }

        .progress-bg { height: 4px; background: #30363d; margin-top: 5px; border-radius: 2px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; transition: 0.5s; }

        h3 { border-left: 4px solid #3fb950; padding-left: 10px; color: #fff; margin-top: 30px;}
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #30363d; color: #f0f6fc; font-size: 0.85rem; }
        td { padding: 12px; border-bottom: 1px solid #21262d; font-size: 0.9rem; }
        tr:hover { background-color: #161b22; }

        .latency-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; color: #0d1117; font-size: 0.75rem; }
        .ping-good { background-color: #3fb950; } 
        .ping-ok { background-color: #d29922; }   
        .ping-bad { background-color: #ff7b72; }  

        /* สไตล์สำหรับผู้บุกรุก (Intruder) */
        .intruder-row { background-color: rgba(255, 123, 114, 0.1) !important; border-left: 3px solid #ff7b72; }
        .intruder-tag { background-color: #ff7b72; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-left: 10px; }
        .trusted-tag { color: #3fb950; font-size: 0.7rem; border: 1px solid #3fb950; padding: 1px 5px; border-radius: 4px; margin-left: 10px; opacity: 0.7;}
    </style>
</head>
<body>

    <div class="grid-row-3">
        <div class="card">
            <h2>Download</h2>
            <div class="value-large color-dl" id="dl-speed">0.00</div>
            <span class="unit">Mbps</span>
        </div>
        
        <div class="card" style="border: 1px solid #3fb950;">
            <h2>Connectivity</h2>
            <div class="value-large color-ip" id="host-ip" style="font-size: 1.8rem;">...</div>
            
            <div style="margin-top: 5px; font-size: 0.8rem; color: #8b949e; border-top: 1px solid #30363d; padding-top: 5px;">
                WAN: <span id="wan-status" style="font-weight: bold;">Checking...</span>
                <span id="wan-ping" style="margin-left: 5px;">(- ms)</span>
            </div>
        </div>

        <div class="card">
            <h2>Upload</h2>
            <div class="value-large color-ul" id="ul-speed">0.00</div>
            <span class="unit">Mbps</span>
        </div>
    </div>

    <div class="grid-row-4">
        <div class="card">
            <h2>CPU Load</h2>
            <div class="value-large color-cpu"><span id="cpu-load">0</span>%</div>
            <div class="progress-bg"><div id="cpu-bar" class="progress-bar" style="background:#d29922;"></div></div>
        </div>
        <div class="card">
            <h2>RAM Usage</h2>
            <div class="value-large color-ram"><span id="ram-usage">0</span>%</div>
             <div class="progress-bg"><div id="ram-bar" class="progress-bar" style="background:#a371f7;"></div></div>
        </div>
        <div class="card">
            <h2>Disk Usage</h2>
            <div class="value-large color-disk"><span id="disk-usage">0</span>%</div>
            <span class="unit" id="disk-total">Total: 0 GB</span>
            <div class="progress-bg"><div id="disk-bar" class="progress-bar" style="background:#f2cc60;"></div></div>
        </div>
        <div class="card">
            <h2>Uptime</h2>
            <div class="value-large color-uptime" id="uptime" style="font-size: 1.5rem;">0h 0m</div>
            <span class="unit">Since Boot</span>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="trafficChart"></canvas>
    </div>

    <h3>CONNECTED DEVICES & SECURITY (<span id="count">0</span>)</h3>
    <table>
        <thead>
            <tr>
                <th>IP Address</th>
                <th>MAC Address</th>
                <th>Latency (Ping)</th>
            </tr>
        </thead>
        <tbody id="device-list"></tbody>
    </table>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        const ctx = document.getElementById('trafficChart').getContext('2d');
        const trafficChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(20).fill(''),
                datasets: [
                    { label: 'Download', borderColor: '#58a6ff', backgroundColor: 'rgba(88, 166, 255, 0.1)', data: Array(20).fill(0), tension: 0.4, fill: true },
                    { label: 'Upload', borderColor: '#ff7b72', backgroundColor: 'rgba(255, 123, 114, 0.1)', data: Array(20).fill(0), tension: 0.4, fill: true }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#c9d1d9' } } },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#30363d' }, ticks: { color: '#8b949e' } },
                    x: { display: false }
                },
                animation: { duration: 0 }
            }
        });

socket.on('dashboard-update', (data) => {
            document.getElementById('host-ip').innerText = data.hostIp;

            document.getElementById('dl-speed').innerText = data.hostSpeed.download;
            document.getElementById('ul-speed').innerText = data.hostSpeed.upload;

            const wanEl = document.getElementById('wan-status');
            wanEl.innerText = data.internet.status;
            document.getElementById('wan-ping').innerText = 'Ping to Google: ' + data.internet.latency + ' ms';
            
            if(data.internet.status === 'Online') {
                wanEl.style.color = '#2ea043'; // เขียว
            } else {
                wanEl.style.color = '#ff7b72'; // แดง
            }


            document.getElementById('cpu-load').innerText = data.system.cpu;
            document.getElementById('cpu-bar').style.width = data.system.cpu + '%';
            document.getElementById('ram-usage').innerText = data.system.ram;
            document.getElementById('ram-bar').style.width = data.system.ram + '%';
            document.getElementById('disk-usage').innerText = data.system.diskPercent;
            document.getElementById('disk-total').innerText = 'Total: ' + data.system.diskTotal + ' GB';
            document.getElementById('disk-bar').style.width = data.system.diskPercent + '%';
            document.getElementById('uptime').innerText = data.system.uptime;

            trafficChart.data.datasets[0].data.push(data.hostSpeed.download);
            trafficChart.data.datasets[1].data.push(data.hostSpeed.upload);
            if(trafficChart.data.datasets[0].data.length > 20) {
                trafficChart.data.datasets[0].data.shift();
                trafficChart.data.datasets[1].data.shift();
            }
            trafficChart.update();

            document.getElementById('count').innerText = data.devices.length;
            const tbody = document.getElementById('device-list');
            tbody.innerHTML = ''; 
            data.devices.forEach(dev => {
                const ms = parseFloat(dev.latency);
                let badgeClass = 'ping-good';
                if (ms > 100) badgeClass = 'ping-bad';
                else if (ms > 50) badgeClass = 'ping-ok';

                let rowClass = '';
                let trustTag = `<span class="intruder-tag"> UNKNOWN</span>`;
                
                if (dev.isTrusted) {
                    rowClass = '';
                    trustTag = `<span class="trusted-tag"> Trusted</span>`;
                } else {
                    rowClass = 'intruder-row'; // ใส่สีแดงถ้าไม่รู้จัก
                }

                const row = `
                <tr class="${rowClass}">
                    <td style="color: #a5d6ff; font-weight: bold;">
                        ${dev.ip}
                    </td>
                    <td style="font-family: monospace; color: #8b949e;">
                        ${dev.mac} ${trustTag}
                    </td>
                    <td><span class="latency-badge ${badgeClass}">${dev.latency} ms</span></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        });
    </script>
</body>
</html>
