<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Studio - Space</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div id="dynamic-bg"></div>

    <div class="sidebar-left">
        <h3 style="font-weight: 600;"><i class="ph ph-sparkle"
                style="margin-right: 8px; color: var(--theme-color);"></i>Music Discovery</h3>
        <p style="font-size:11px; color:#86868b; margin-top:-10px; margin-bottom:15px;">
            ㅤดับเบิ้ลคลิกเพื่อเพิ่มเพลงลงในสเปซ</p>
        <div class="search-group"> 
            <input type="text" id="query" placeholder="หาเพลงโปรด..." autocomplete="off">
            <div id="suggestions" class="suggestions-box"></div>
        </div>
        <div class="scrollable-content" id="searchResults"></div>
    </div>

    <div class="main-content">
        <div class="player-wrapper">
            <div class="video-card">
                <video id="player" autoplay crossorigin="anonymous"></video>
            </div>

            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" class="premium-slider progress-slider" min="0" max="100" value="0"
                    step="0.1">
                <span id="durationTime">0:00</span>
            </div>

            <div class="premium-control-bar">
                <button class="icon-btn" onclick="togglePiP()" title="จอเล็กแบบลอย (P)">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path
                            d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16.01H3V4.98h18v14.03z" />
                    </svg>
                </button>

                <button class="icon-btn" onclick="toggleTheater()" title="โหมดโรงหนัง (T)">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path
                            d="M21 4H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H3V6h18v12z" />
                    </svg>
                </button>

                <button class="icon-btn" onclick="toggleFullScreen()" title="เต็มจอ (F)">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                    </svg>
                </button>
                <div class="divider"></div>
                <button class="icon-btn" onclick="playPrevious()" title="ก่อนหน้า">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path
                            d="M6 7v10c0 .55.45 1 1 1s1-.45 1-1V7c0-.55-.45-1-1-1s-1 .45-1 1zm10.42 10.11L10.65 13.04c-.56-.4-.56-1.24 0-1.63l5.77-4.07c.67-.47 1.58 0 1.58.82v8.14c0 .81-.91 1.28-1.58.82z" />
                    </svg>
                </button>
                <button class="icon-btn play-pause-btn" id="playPauseBtn" onclick="togglePlay()" title="เล่น/หยุด">
                    <svg class="svg-icon-large" viewBox="0 0 24 24">
                        <path
                            d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18c.62-.39.62-1.29 0-1.69L9.54 5.98C8.87 5.55 8 6.03 8 6.82z" />
                    </svg>
                </button>
                <button class="icon-btn" onclick="playNext()" title="ถัดไป">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path
                            d="M7.58 16.89l5.77-4.07c.56-.4.56-1.24 0-1.63L7.58 7.11C6.91 6.65 6 7.12 6 7.93v8.14c0 .81.91 1.28 1.58.82zM16 7v10c0 .55.45 1 1 1s1-.45 1-1V7c0-.55-.45-1-1-1s-1 .45-1 1z" />
                    </svg>
                </button>

                <button class="icon-btn" id="autoPlayBtn" onclick="toggleAutoPlay()"
                    title="เล่นอัตโนมัติ (Endless Radio)">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path
                            d="M18.6 6.62c-1.44 0-2.8.56-3.77 1.53L12 10.66 10.48 12h.01L7.8 14.39c-.64.64-1.49.99-2.4.99-1.87 0-3.39-1.51-3.39-3.38S3.53 8.62 5.4 8.62c.91 0 1.76.35 2.44 1.03l1.13 1 1.51-1.34L9.22 8.2C8.2 7.18 6.84 6.62 5.4 6.62 2.42 6.62 0 9.04 0 12s2.42 5.38 5.4 5.38c1.44 0 2.8-.56 3.77-1.53l2.83-2.5.01.01L13.52 12h-.01l2.69-2.39c.64-.64 1.49-.99 2.4-.99 1.87 0 3.39 1.51 3.39 3.38s-1.52 3.38-3.39 3.38c-.9 0-1.76-.35-2.44-1.03l-1.14-1.01-1.51 1.34 1.27 1.12c1.02 1.01 2.37 1.57 3.82 1.57 2.98 0 5.4-2.41 5.4-5.38s-2.42-5.37-5.4-5.37z" />
                    </svg>
                </button>
                <div class="divider"></div>
                <div class="volume-container">
                    <svg class="vol-icon" id="volIcon" onclick="toggleMute()" style="cursor: pointer;"
                        viewBox="0 0 24 24">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                    <input type="range" id="volumeSlider" class="premium-slider" min="0" max="1" step="0.01" value="1"
                        oninput="changeVolume()">
                </div>
            </div>
        </div>

        <div class="info-wrapper">
            <div class="now-playing-container">
                <div class="status-label">CURRENTLY PLAYING</div>

                <h1 id="currentSongTitle" class="song-title-display" onclick="toggleLyrics()"
                    title="💡 คลิกเพื่อเปิดโหมดเนื้อเพลง (หรือกด K)">เพลย์ลิสต์ที่ดีที่สุด</h1>

                <div id="upNextDisplay" class="up-next-minimal">ถัดไป: -</div>
            </div>
        </div>
    </div>
    <div class="lyrics-wrapper" id="lyricsWrapper">
        <div class="lyrics-content" id="lyricsContent">
            <div class="lyric-line">กดตัว K เพื่อเปิดโหมดเนื้อเพลง...</div>
        </div>
    </div>

    <div class="sidebar-right">
        <h3 style="font-weight: 600;"><i class="ph ph-playlist"
                style="margin-right: 8px; color: var(--theme-color);"></i>Queues</h3>
        <p style="font-size:11px; color:var(--theme-color); margin-top:-10px; margin-bottom:30px;"> </p>
        <div class="scrollable-content" id="readyQueue"></div>
    </div>

    <script src="/static/script.js">
</script>
</body>

</html>
