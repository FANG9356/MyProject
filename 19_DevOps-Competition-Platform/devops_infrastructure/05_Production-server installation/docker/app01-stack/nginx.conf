events {
    worker_connections 1024;
}

http {
    # 🌟 การตั้งค่าพื้นฐาน
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name naphat.production;

        # 🌟 ตั้งค่า Header มาตรฐานเพื่อให้ Container หลังบ้านรู้ IP จริงของคนเข้าเว็บ
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ==========================================
        # 1. Frontend (ทางเข้าหลัก)
        # ==========================================
        location / {
            proxy_pass http://frontend:80;
            # ป้องกัน Error หน้าขาวเวลาคนกด Refresh หน้าเว็บ (สำหรับ React/Vue)
            error_page 404 /index.html;
        }

        # ==========================================
        # 2. Backend (API)
        # ==========================================
        # สมมติว่า API ของคุณครูขึ้นต้นด้วย /api เช่น http://192.168.1.135/api/users
        location /api/ {
            proxy_pass http://backend:8000;
        }

        # ==========================================
        # 3. Grafana Dashboard
        # ==========================================
        location /grafana/ {
            proxy_pass http://grafana:3000;   
        }

        # ==========================================
        # 4. Node-RED (ต้องเปิดโหมด WebSocket ให้ลากสาย Flow ได้)
        # ==========================================
        location /nodered/ {
            proxy_pass http://nodered:1880/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ==========================================
        # 5. EMQX Dashboard
        # ==========================================
        location /emqx/ {
            proxy_pass http://emqx:18083/;
        }
    }
}