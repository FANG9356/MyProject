<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Moisture Tracker - Phakhaphon Sukmee</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
        .header { padding: 16px 24px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 18px; font-weight: 600; }
        .metrics-bar { display: flex; gap: 24px; padding: 12px 24px; background: #1e293b; border-bottom: 1px solid #334155; font-size: 14px; }
        .metric-item { display: flex; flex-direction: column; }
        .metric-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        .metric-value { font-weight: 600; color: #38bdf8; font-size: 15px; }
        #map { height: calc(100vh - 120px); width: 100%; }
        .robot-pin { background: #0284c7; color: #ffffff; border: 2px solid #ffffff; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; box-shadow: 0 0 10px rgba(2,132,199,0.5); }
        .target-pin { background: #e11d48; color: #ffffff; border: 2px solid #ffffff; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; }
        .dispatch-btn { background: #0284c7; color: #ffffff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; margin-top: 8px; }
        .dispatch-btn:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Autonomous Robot Moisture Telemetry</h1>
        <div id="connectionStatus" style="font-size: 12px; color: #10b981;">Online Monitoring</div>
    </div>
    <div class="metrics-bar">
        <div class="metric-item">
            <span class="metric-label">Latitude</span>
            <span class="metric-value" id="valLat">13.7563</span>
        </div>
        <div class="metric-item">
            <span class="metric-label">Longitude</span>
            <span class="metric-value" id="valLng">100.5018</span>
        </div>
        <div class="metric-item">
            <span class="metric-label">Soil Moisture</span>
            <span class="metric-value" id="valMoisture">78.5 %</span>
        </div>
        <div class="metric-item">
            <span class="metric-label">Robot State</span>
            <span class="metric-value" id="valState">Standby</span>
        </div>
        <div class="metric-item">
            <span class="metric-label">Target Destination</span>
            <span class="metric-value" id="valTarget">-</span>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        const map = L.map('map').setView([13.7563, 100.5018], 15);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: 'OpenStreetMap'
        }).addTo(map);

        let robotMarker = L.marker([13.7563, 100.5018], {
            icon: L.divIcon({
                className: '',
                html: '<div class="robot-pin">R1</div>',
                iconSize: [24, 24]
            })
        }).addTo(map);

        let targetMarker = null;

        function updateRobotTelemetry(lat, lng, moisture, isMeasuring) {
            document.getElementById('valLat').textContent = lat.toFixed(4);
            document.getElementById('valLng').textContent = lng.toFixed(4);
            document.getElementById('valMoisture').textContent = moisture.toFixed(1) + ' %';
            document.getElementById('valState').textContent = isMeasuring ? 'Measuring Active' : 'Standby';
            robotMarker.setLatLng([lat, lng]);
        }

        window.sendTargetCommand = function(lat, lng) {
            document.getElementById('valTarget').textContent = lat.toFixed(4) + ', ' + lng.toFixed(4);
            document.getElementById('valState').textContent = 'Moving to Target';
            setTimeout(() => {
                updateRobotTelemetry(lat, lng, 65.2 + Math.random() * 15, false);
            }, 2000);
        };

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            if (targetMarker) {
                map.removeLayer(targetMarker);
            }

            targetMarker = L.marker([lat, lng], {
                icon: L.divIcon({
                    className: '',
                    html: '<div class="target-pin">T</div>',
                    iconSize: [20, 20]
                })
            }).addTo(map);

            const popup = `
                <div style="font-size: 13px; color: #1e293b;">
                    <strong>Destination Coordinate</strong><br>
                    Lat: ${lat.toFixed(4)}<br>
                    Lng: ${lng.toFixed(4)}<br>
                    <button class="dispatch-btn" onclick="sendTargetCommand(${lat}, ${lng})">Dispatch Robot</button>
                </div>
            `;
            targetMarker.bindPopup(popup).openPopup();
        });
    </script>
</body>
</html>
