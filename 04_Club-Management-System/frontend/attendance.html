<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_bAZkqDNIPIpN-E0ajt3jC6rSv0WUTZaC1Q&s">

    <script src="auth.js?v=2"></script>
    <script>blockDevTools();</script>

</head>
<body class="bg-gray-100 font-sans p-4 md:p-8 min-h-screen flex flex-col">
    
    <div class="max-w-7xl mx-auto w-full shrink-0">
        <nav class="bg-white shadow-sm border border-gray-200 mb-8 rounded-2xl px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <img src="https://rms.utc.ac.th/files/01013_1809190994117.png" alt="Logo" class="h-10 w-10 rounded-full shadow-sm">
                <span class="text-xl font-bold text-indigo-700">ระบบจัดการชมรม</span>
            </div>
            <div class="flex flex-wrap justify-center gap-2">
                <a href="index.html" class="px-4 py-2 text-gray-600 font-semibold rounded-lg hover:bg-gray-100 hover:text-indigo-600 transition-colors text-sm">หน้าหลัก</a>
                <a href="register.html" class="px-4 py-2 text-gray-600 font-semibold rounded-lg hover:bg-gray-100 hover:text-indigo-600 transition-colors text-sm">ลงทะเบียน</a>
                <a href="statusattendance.html" class="px-4 py-2 text-gray-600 font-semibold rounded-lg hover:bg-gray-100 hover:text-indigo-600 transition-colors text-sm">เช็คสถานะการเข้าชมรม</a>
                <a href="admin.html" class="px-4 py-2 bg-indigo-50 text-indigo-700 font-semibold rounded-lg transition-colors text-sm shadow-sm">ระบบแอดมิน</a>
            </div>
        </nav>
    </div>

    <div class="w-full max-w-[1600px] mx-auto shrink-0 mb-6">
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-2">
                <span class="bg-indigo-100 text-indigo-700 px-4 py-1.5 rounded-full text-sm font-bold border border-indigo-200" id="admin-name-display">ผู้ใช้งาน: กำลังโหลด...</span>
            </div>
            
            <div class="flex space-x-2 bg-white shadow-sm p-1.5 rounded-xl border border-gray-200">
                <a href="data.html" class="px-6 py-2 text-gray-500 hover:text-indigo-600 rounded-lg font-semibold text-sm transition-all border border-transparent">จัดการสมาชิก</a>
                <a href="attendance.html" class="px-6 py-2 bg-indigo-50 text-indigo-700 rounded-lg font-semibold text-sm transition-all">เช็คชื่อกิจกรรม</a>
            </div>
            
            <button onclick="logout()" class="px-5 py-2.5 bg-rose-50 text-rose-600 hover:bg-rose-100 hover:text-rose-700 rounded-xl font-bold transition-all text-sm flex items-center border border-rose-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                ออกจากระบบ
            </button>
        </div>
    </div>

    <div class="w-full flex-1 max-w-[1600px] mx-auto">
        <div class="flex flex-col sm:flex-row justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-4 sm:mb-0">ระบบเช็กชื่อกิจกรรมชมรม</h1>
            <button onclick="openActivityModal()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl shadow-sm hover:bg-indigo-700 hover:shadow transition-all flex items-center font-semibold text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                สร้างกิจกรรมใหม่
            </button>
        </div>
        
        <div id="attendance-section" class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200 mb-6 w-full mx-auto">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 mr-3 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                </svg>
                เช็กชื่อกิจกรรม
            </h2>
            <div class="flex flex-col sm:flex-row gap-4 mb-8 bg-gray-50 p-5 rounded-xl border border-gray-100 shadow-inner">
                <div class="flex-1">  
                    <label class="block text-sm font-bold text-gray-700 mb-2">เลือกชมรม</label>
                    <select id="club-select" class="block w-full rounded-xl border-gray-300 shadow-sm p-3 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-all hover:border-indigo-400 cursor-pointer outline-none"></select>
                </div>
                <div class="flex-1 flex flex-row items-end gap-3">
                    <div class="flex-1">
                        <label class="block text-sm font-bold text-gray-700 mb-2">เลือกกิจกรรม</label>
                        <select id="activity-select" class="block w-full rounded-xl border-gray-300 shadow-sm p-3 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-all hover:border-indigo-400 cursor-pointer outline-none"></select>
                    </div>
                    <button id="delete-activity-btn" onclick="deleteActivity()" class="bg-rose-50 text-rose-500 p-3 rounded-xl border border-rose-100 hover:bg-rose-500 hover:text-white transition-all hidden shrink-0" title="ลบกิจกรรม">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <div id="member-list" class="space-y-3">
                </div>
        </div>
        <div id="report-section" class="bg-white p-6 rounded-2xl shadow-lg mb-6 hidden">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">รายงานสรุป</h2>
            <p id="report-summary" class="mb-4 text-gray-600"></p>
            <div id="report-member-list">
                </div>
            <button onclick="showAttendanceList()" class="bg-gray-500 text-white px-4 py-2 rounded-full mt-4 hover:bg-gray-600">
                กลับ
            </button>
        </div>
    </div>
    
    <footer class="w-full mt-10 mb-6 py-4 text-center">
        <a href="superadmin/index (1).html" class="text-xs font-semibold text-gray-400 hover:text-indigo-500 transition-colors">
            เข้าสู่พื้นที่จัดการระบบขั้นสูง
        </a>
    </footer>
    <div id="activity-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md mx-4">
            <h3 class="text-xl font-bold text-gray-800 mb-4">สร้างกิจกรรมใหม่</h3>
            <form id="activity-form" class="space-y-4">
                <div>
                    <label for="activity-name" class="block text-sm font-medium text-gray-700">ชื่อกิจกรรม</label>
                    <input type="text" id="activity-name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>
                <div>
                    <label for="activity-date" class="block text-sm font-medium text-gray-700">วันที่จัดกิจกรรม</label>
                    <input type="date" id="activity-date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md font-semibold hover:bg-indigo-700">บันทึกกิจกรรม</button>
            </form>
        </div>
    </div>
    <script src="attendance.js"></script>
</body>
</html>
