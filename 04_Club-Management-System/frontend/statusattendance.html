<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตรวจสอบสถานะการเข้ากิจกรรม</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="https://rms.utc.ac.th/files/01013_1809190994117.png">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
    
    <script src="auth.js?v=2"></script>
    <script>blockDevTools();</script>
</head>
<body class="bg-gray-100 font-sans p-6">
    <div class="max-w-7xl mx-auto">
        
        <nav class="bg-white shadow-sm border border-gray-200 mb-8 rounded-2xl px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <img src="https://rms.utc.ac.th/files/01013_1809190994117.png" alt="Logo" class="h-10 w-10 rounded-full shadow-sm">
                <span class="text-xl font-bold text-indigo-700">ระบบจัดการชมรม</span>
            </div>
            <div class="flex flex-wrap justify-center gap-2">
                <a href="index.html" class="px-4 py-2 text-gray-600 font-semibold rounded-lg hover:bg-gray-100 hover:text-indigo-600 transition-colors text-sm">หน้าหลัก</a>
                <a href="register.html" class="px-4 py-2 text-gray-600 font-semibold rounded-lg hover:bg-gray-100 hover:text-indigo-600 transition-colors text-sm">ลงทะเบียน</a>
                <a href="statusattendance.html" class="px-4 py-2 bg-indigo-50 text-indigo-700 font-semibold rounded-lg transition-colors text-sm shadow-sm">เช็คสถานะการเข้าชมรม</a>
                <a href="admin.html" class="px-4 py-2 text-gray-600 font-semibold rounded-lg hover:bg-gray-100 hover:text-indigo-600 transition-colors text-sm">ระบบแอดมิน</a>
            </div>
        </nav>

        <div class="flex justify-between items-center mb-6 px-2">
            <h1 class="text-2xl font-bold text-gray-800 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                </svg>
                ตรวจสอบสถานะการเข้ากิจกรรม
            </h1>
        </div>

        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200 mb-6 max-w-4xl mx-auto">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 mr-3 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                รายชื่อผู้เข้าร่วม
            </h2>
            
            <div class="flex flex-col sm:flex-row gap-4 mb-8 bg-gray-50 p-5 rounded-xl border border-gray-100 shadow-inner">
                <div class="flex-1">  
                    <label class="block text-sm font-bold text-gray-700 mb-2">เลือกชมรม</label>
                    <select id="club-select" class="block w-full rounded-xl border-gray-300 shadow-sm p-3 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-all hover:border-indigo-400 cursor-pointer outline-none">
                        <option value="">-- กำลังโหลดข้อมูล... --</option>
                    </select>
                </div>
                <div class="flex-1">
                    <label class="block text-sm font-bold text-gray-700 mb-2">เลือกกิจกรรม</label>
                    <select id="activity-select" class="block w-full rounded-xl border-gray-300 shadow-sm p-3 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-all hover:border-indigo-400 cursor-pointer outline-none">
                        <option value="">-- เลือกกิจกรรม --</option>
                    </select>
                </div>
            </div>

            <div id="member-list" class="space-y-3">
                <div class="flex flex-col items-center justify-center py-12 text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                    <p class="text-lg font-medium">กรุณาเลือกชมรมและกิจกรรมเพื่อดูสถานะ</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allMembers = [];
        let allActivities = [];
        let dynamicClubList = [];
        let currentClub = '';
        let currentActivityId = null;

        const clubSelect = document.getElementById('club-select');
        const activitySelect = document.getElementById('activity-select');
        const memberListDiv = document.getElementById('member-list');

        async function fetchAllData() {
            try {
                const clubsRes = await fetch('/api/clubs');
                const clubsData = await clubsRes.json();
                
                dynamicClubList = Object.keys(clubsData).sort((a, b) => {
                    const activeA = clubsData[a] ? 1 : 0;
                    const activeB = clubsData[b] ? 1 : 0;
                    if (activeA !== activeB) return activeB - activeA;
                    return a.localeCompare(b);
                });
                
                const currentSelected = clubSelect.value;
                clubSelect.innerHTML = `<option value="">-- เลือกชมรม --</option>` + 
                    dynamicClubList.map(club => {
                        if (clubsData[club]) {
                            return `<option value="${club}" class="text-gray-800">${club}</option>`;
                        } else {
                            return `<option value="${club}" class="text-rose-500 bg-rose-50">${club} (ปิดชั่วคราว)</option>`;
                        }
                    }).join('');
                if (dynamicClubList.includes(currentSelected)) {
                    clubSelect.value = currentSelected;
                }

                const actRes = await fetch('/api/activities');
                const actData = await actRes.json();
                allActivities = Object.values(actData);
                
                renderActivities();
                if (currentClub && currentActivityId) renderAttendanceList();
            } catch(e) {
                console.error(e);
            }
        }

        function renderActivities() {
            const filteredActivities = allActivities.filter(act => act.club === currentClub);
            
            activitySelect.innerHTML = `<option value="">-- เลือกกิจกรรม --</option>` + filteredActivities.map(act => {
                const formattedDate = act.date ? new Date(act.date).toLocaleDateString('th-TH') : '';
                return `<option value="${act.id}">${act.activityName} (${formattedDate})</option>`;
            }).join('');
            
            if (!filteredActivities.find(act => String(act.id) === String(currentActivityId))) {
                currentActivityId = null;
            }
            activitySelect.value = currentActivityId || '';
        }

        async function renderAttendanceList() {
            if (!currentActivityId || !currentClub) {
                memberListDiv.innerHTML = '<p class="text-gray-500 text-center py-8">กรุณาเลือกทั้งชมรมและกิจกรรมเพื่อดูสถานะ</p>';
                return;
            }
            
            try {
                const res = await fetch(`/api/publicAttendance/${currentActivityId}`);
                const allAttendanceData = await res.json();
                
                const clubMembers = allAttendanceData[currentClub] || [];
                
                const memberHTML = clubMembers.sort((a, b) => a.name.localeCompare(b.name, 'th')).map(member => {
                    const status = member.status || 'ไม่มา';
                    
                    let statusUI = '';
                    if (status === 'มา') {
                        statusUI = '<span class="px-4 py-1.5 rounded-full bg-green-100 text-green-700 font-bold text-sm shadow-sm inline-block w-20 text-center">มา</span>';
                    } else if (status === 'ไม่มา') {
                        statusUI = '<span class="px-4 py-1.5 rounded-full bg-red-100 text-red-700 font-bold text-sm shadow-sm inline-block w-20 text-center">ไม่มา</span>';
                    } else if (status === 'ลา') {
                        statusUI = '<span class="px-4 py-1.5 rounded-full bg-yellow-100 text-yellow-700 font-bold text-sm shadow-sm inline-block w-20 text-center">ลา</span>';
                    }

                    return `
                        <div class="flex items-center justify-between p-3 border border-gray-100 rounded-xl mb-2 bg-white hover:shadow-md transition-shadow">
                            <div class="flex-grow">
                                <p class="text-sm font-bold text-gray-800">${member.titlePrefix} ${member.name}</p>
                                <p class="text-xs text-gray-500 mt-1">${member.grade} | ${member.major}</p>
                            </div>
                            <div class="ml-4">
                                ${statusUI}
                            </div>
                        </div>
                    `;
                }).join('');
                
                memberListDiv.innerHTML = memberHTML || '<p class="text-gray-500 text-center py-8">ยังไม่มีสมาชิกในชมรมนี้</p>';
            } catch(e) {
                console.error(e);
            }
        }

        clubSelect.addEventListener('change', () => {
            currentClub = clubSelect.value;
            currentActivityId = null;
            renderActivities();
            renderAttendanceList(); 
        });

        activitySelect.addEventListener('change', () => {
            currentActivityId = activitySelect.value;
            renderAttendanceList();
        });

        fetchAllData();
    </script>
</body>
</html>
