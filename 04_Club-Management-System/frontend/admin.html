<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ (Admin Panel)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://rms.utc.ac.th/files/01013_1809190994117.png">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>

    <!-- Security -->
    <script src="auth.js"></script>
    <script>blockDevTools();</script>

</head>
<body class="bg-gray-100 p-4 md:p-8 min-h-screen flex flex-col font-sans">
    
    <!-- Navigation Bar -->
    <div class="max-w-7xl mx-auto w-full shrink-0">
        <nav class="bg-white shadow-sm border border-gray-200 mb-8 rounded-2xl px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <img src="https://rms.utc.ac.th/files/01013_1809190994117.png" alt="Logo" class="h-10 w-10 rounded-full shadow-sm">
                <span class="text-xl font-bold text-indigo-700">ระบบจัดการชมรม</span>
            </div>
            <div class="flex flex-wrap justify-center gap-2">
                <a href="index.html" class="px-4 py-2 text-gray-600 font-semibold rounded-lg hover:bg-gray-100 hover:text-indigo-600 transition-colors text-sm">หน้าหลัก</a>
                <a href="register.html" class="px-4 py-2 text-gray-600 font-semibold rounded-lg hover:bg-gray-100 hover:text-indigo-600 transition-colors text-sm">ลงทะเบียน</a>
                <a href="statusattendance.html" class="px-4 py-2 text-gray-600 font-semibold rounded-lg hover:bg-gray-100 hover:text-indigo-600 transition-colors text-sm">เช็คสถานะการเข้าชมรม</a>
                <a href="admin.html" class="px-4 py-2 bg-indigo-50 text-indigo-700 font-semibold rounded-lg transition-colors text-sm shadow-sm">ระบบแอดมิน</a>
            </div>
        </nav>
    </div>

    <!-- Login Screen -->
    <div class="flex-1 flex items-center justify-center transition-opacity duration-300">
        <div class="bg-white p-8 md:p-10 rounded-3xl shadow-sm border border-gray-200 w-full max-w-md text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-indigo-500"></div>
            <img src="https://rms.utc.ac.th/files/01013_1809190994117.png" alt="Logo" class="h-20 w-20 mx-auto mb-4 shadow-sm rounded-full">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Admin Panel</h2>
            <p class="text-sm text-gray-500 mb-6">เข้าสู่ระบบสำหรับเจ้าหน้าที่เพื่อจัดการข้อมูล</p>
            
            <form id="login-form" class="space-y-4">
                <input type="text" id="admin-user" placeholder="ชื่อผู้ใช้งาน (Username)" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-center bg-gray-50">
                <input type="password" id="admin-pass" placeholder="รหัสผ่าน" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-center bg-gray-50">
                <button type="submit" id="login-btn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 shadow-sm transition-all flex justify-center items-center">
                    <span>เข้าสู่ระบบ</span>
                </button>
                <p id="login-error" class="text-red-500 text-sm hidden font-semibold bg-red-50 p-2 rounded-lg mt-2">❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</p>
            </form>
        </div>
    </div>

    <script>
        // Redirect to native dashboard if already logged in and session is valid
        if (sessionStorage.getItem('adminName')) {
            const loginTimestamp = sessionStorage.getItem('loginTimestamp');
            if (loginTimestamp && Date.now() - parseInt(loginTimestamp) <= 30 * 60 * 1000) {
                window.location.href = 'data.html';
            } else {
                sessionStorage.removeItem('adminName');
                sessionStorage.removeItem('loginTimestamp');
                sessionStorage.removeItem('token');
            }
        }

        const loginBtn = document.getElementById('login-btn');
        const errorMsg = document.getElementById('login-error');

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const user = document.getElementById('admin-user').value.trim();
            const pass = document.getElementById('admin-pass').value;
            
            loginBtn.innerHTML = 'กำลังตรวจสอบ...';
            loginBtn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();
                
                if (data.success) {
                    sessionStorage.setItem('adminName', data.name);
                    sessionStorage.setItem('loginTimestamp', Date.now());
                    sessionStorage.setItem('token', data.token);
                    window.location.href = 'data.html';
                } else {
                    errorMsg.classList.remove('hidden');
                    setTimeout(() => errorMsg.classList.add('hidden'), 3000);
                    loginBtn.innerHTML = 'เข้าสู่ระบบ';
                    loginBtn.disabled = false;
                }
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์: " + error.message);
                loginBtn.innerHTML = 'เข้าสู่ระบบ';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
