                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-green-500" viewBox="0 0 20 20" fill="currentColor">

    <div id="member-modal" class="fixed inset-0 z-[100] bg-gray-900 bg-opacity-60 backdrop-blur-sm flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-xl font-bold text-gray-800"></h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <form id="member-form" class="space-y-4">
                <div>
                    <label for="studentId" class="block text-sm font-medium text-gray-700">รหัสนักศึกษา</label>
                    <input type="text" id="studentId" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                </div>
                
                <div class="flex space-x-2">
                    <div class="w-1/3">
                        <label for="titlePrefix" class="block text-sm font-medium text-gray-700">คำนำหน้า</label>
                        <select id="titlePrefix" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                            <option value="นาย">นาย</option>
                            <option value="นางสาว">นางสาว</option>
                        </select>
                    </div>
                    <div class="w-1/3">
                        <label for="firstName" class="block text-sm font-medium text-gray-700">ชื่อ</label>
                        <input type="text" id="firstName" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                    </div>
                    <div class="w-1/3">
                        <label for="lastName" class="block text-sm font-medium text-gray-700">นามสกุล</label>
                        <input type="text" id="lastName" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                    </div>
                </div>

                <div>
                    <label for="grade" class="block text-sm font-medium text-gray-700">ชั้นปี</label>
                    <select id="grade" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"></select>
                </div>
                <div>
                    <label for="major" class="block text-sm font-medium text-gray-700">สาขาวิชา</label>
                    <select id="major" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"></select>
                </div>
                <div>
                    <label for="club" class="block text-sm font-medium text-gray-700">ชมรม</label>
                    <select id="club" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"></select>
                </div>
                <div id="modal-message" class="text-center text-sm"></div>
                <button type="button" id="submit-button" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md shadow-lg hover:bg-indigo-700 transition-colors font-semibold"></button>
            </form>
        </div>
    </div>

    <script>let dynamicClubList = [];
        const titlePrefixes = ["นาย", "นางสาว"];
        let gradeList = [];
        let majorList = {};

        let activitiesData = {};
        let attendanceData = {};
        let membersData = [];
        let globalClubsData = {};

        const token = checkSession('admin.html');
        const adminName = sessionStorage.getItem('adminName');
        if (adminName) document.getElementById('admin-name-display').innerText = 'ผู้ใช้งาน: ' + adminName;
        startSessionTimer('admin.html');

        const _origFetch = window.fetch;
        window.fetch = async function(resource, config) {
            const tok = sessionStorage.getItem('token');
            if (tok && typeof resource === 'string' && resource.startsWith('/api/')) {
                config = config || {};
                config.headers = { ...(config.headers || {}), 'Authorization': 'Bearer ' + tok };
            }
            const res = await _origFetch(resource, config);
            if ((res.status === 401 || res.status === 403) && resource.startsWith('/api/')) {
                clearSession('admin.html');
            }
            return res;
        };

        function logout() { clearSession('admin.html'); }

        async function fetchAllData() {
            try {

                try {
                    const setRes = await fetch('/api/settings');
                    const setData = await setRes.json();
                    if (setData.gradeList) gradeList = setData.gradeList;
                    if (setData.majorList) majorList = setData.majorList;
                } catch(e) {
                    console.error('Error fetching settings', e);
                    gradeList = ["ปวช. 1", "ปวส. 1"];
                    majorList = {'ปวช': ["เทคนิคคอมพิวเตอร์"], 'ปวส': ["เทคโนโลยีคอมพิวเตอร์"]};
                }

                const clubsRes = await fetch('/api/clubs');
                const clubsData = await clubsRes.json();
                globalClubsData = clubsData;

                dynamicClubList = Object.keys(clubsData).sort((a, b) => {
                    const statusA = clubsData[a] === true ? 1 : 0;
                    const statusB = clubsData[b] === true ? 1 : 0;
                    return statusB - statusA;
                });

                const memRes = await fetch('/api/members');
                const memData = await memRes.json();
                membersData = Object.values(memData);

                const actRes = await fetch('/api/activities');
                activitiesData = await actRes.json();

                const attRes = await fetch('/api/attendance');
                attendanceData = await attRes.json();

                renderClubs();
            } catch(e) {
                console.error(e);
            }
        }

        function renderClubs() {
            const container = document.getElementById('clubs-display-area');
            container.innerHTML = '';

            if (dynamicClubList.length === 0 && membersData.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-gray-500 py-10">ยังไม่มีรายชื่อชมรมในระบบ</div>';
                return;
            }

            dynamicClubList.forEach(clubName => {
                const isActive = globalClubsData[clubName] === true;
                const clubMembers = membersData.filter(member => member.club === clubName);
                const containerId = clubName.replace(/ /g, '-');
                const count = clubMembers.length;

                const badgeHtml = isActive
                    ? `<span class="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full border border-indigo-100">${count} คน</span>`
                    : `<span class="bg-rose-50 text-rose-600 text-[10px] font-bold px-2 py-0.5 rounded-full border border-rose-100">ปิดชั่วคราว</span>
                       <span class="bg-gray-100 text-gray-500 text-xs font-bold px-3 py-1 rounded-full ml-1">${count} คน</span>`;

                const borderAccent = isActive ? 'border-l-4 border-l-indigo-500' : 'border-l-4 border-l-rose-400 opacity-80';

                let html = `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 ${borderAccent} mb-6 club-container overflow-hidden h-max break-inside-avoid hover:shadow-md transition-all">
                        <div class="px-5 py-4 border-b border-gray-50 flex justify-between items-center bg-gray-50/50">
                            <h2 class="text-lg font-extrabold ${isActive ? 'text-gray-800' : 'text-gray-500'} flex-1 leading-tight pr-2">${clubName}</h2>
                            <div class="flex items-center shrink-0">
                                ${badgeHtml}
                            </div>
                        </div>
                        <div class="p-2" id="${containerId}">
                            ${renderMembers(clubMembers)}
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });

            const orphanedMembers = membersData.filter(member => !dynamicClubList.includes(member.club));

            if (orphanedMembers.length > 0) {
                let html = `
                    <div class="bg-red-50 p-6 rounded-2xl shadow-lg mb-6 club-container border border-red-200">
                        <h2 class="text-xl font-bold text-red-600 mb-4 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                            </svg>
                            สมาชิกตกค้าง / ชมรมถูกปิด (${orphanedMembers.length})
                        </h2>
                        <p class="text-xs text-red-500 mb-4">รายชื่อที่ชมรมโดนปิดไปแล้ว</p>
                        <div id="orphaned-members">
                            ${renderMembers(orphanedMembers)}
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            }
        }

        function renderMembers(members) {
            members.sort((a, b) => a.studentId.localeCompare(b.studentId));
            if (members.length === 0) {
                return '<p class="text-gray-500 text-center">ยังไม่มีสมาชิก</p>';
            }
            return members.map((member, index) => `
                <div class="flex items-center justify-between py-2.5 px-3 border-b border-gray-50 last:border-b-0 group hover:bg-indigo-50/30 transition-colors rounded-xl mx-1 my-0.5">
                    <div class="flex items-center flex-grow min-w-0">
                        <span class="text-gray-300 font-bold w-6 text-right mr-3 text-xs shrink-0">${index + 1}</span>
                        <div class="truncate">
                            <p class="text-sm font-bold text-gray-700 truncate">${member.titlePrefix}${member.name}</p>
                            <p class="text-[11px] text-gray-400 mt-0.5 truncate">${member.studentId} &bull; ${member.grade} &bull; ${member.major}</p>
                        </div>
                    </div>
                    <div class="flex space-x-1 shrink-0 ml-2">
                        <button onclick="handleEdit('${member.studentId}')" class="text-gray-400 hover:text-indigo-600 hover:bg-indigo-100 p-1.5 rounded-lg transition-all" title="แก้ไข">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                            </svg>
                        </button>
                        <button onclick="handleDelete('${member.studentId}')" class="text-gray-400 hover:text-rose-600 hover:bg-rose-100 p-1.5 rounded-lg transition-all" title="ลบ">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        window.openModal = function(member = null) {
            const modal = document.getElementById('member-modal');
            const modalTitle = document.getElementById('modal-title');
            const submitButton = document.getElementById('submit-button');
            const studentIdInput = document.getElementById('studentId');
            const titlePrefixSelect = document.getElementById('titlePrefix');
            const firstNameInput = document.getElementById('firstName');
            const lastNameInput = document.getElementById('lastName');
            const gradeSelect = document.getElementById('grade');
            const majorSelect = document.getElementById('major');
            const clubSelect = document.getElementById('club');

            document.getElementById('modal-message').innerText = '';

            clubSelect.innerHTML = `<option value="">-- เลือกชมรม --</option>` +
                dynamicClubList.map(club => `<option value="${club}">${club}</option>`).join('');

            titlePrefixSelect.innerHTML = titlePrefixes.map(prefix => `<option value="${prefix}">${prefix}</option>`).join('');
            gradeSelect.innerHTML = gradeList.map(grade => `<option value="${grade}">${grade}</option>`).join('');

            const updateMajorOptions = () => {
                const selectedGrade = gradeSelect.value || gradeList[0] || '';
                const gradeType = selectedGrade.split('.')[0].trim();
                const majors = majorList[gradeType] || [];
                majorSelect.innerHTML = majors.map(major => `<option value="${major}">${major}</option>`).join('');
            };
            gradeSelect.onchange = updateMajorOptions;

            studentIdInput.readOnly = false;
            studentIdInput.classList.remove('bg-gray-100', 'cursor-not-allowed');

            if (member) {
                modalTitle.innerText = 'แก้ไข/ย้ายสมาชิก';
                submitButton.innerText = 'บันทึกการแก้ไข';
                submitButton.onclick = () => saveMember(member.studentId);

                studentIdInput.value = member.studentId;
                titlePrefixSelect.value = member.titlePrefix || 'นาย';

                const nameParts = member.name.split(' ');
                firstNameInput.value = nameParts[0] || '';
                lastNameInput.value = nameParts.slice(1).join(' ') || '';

                gradeSelect.value = member.grade;
                updateMajorOptions();
                majorSelect.value = member.major;

                if (dynamicClubList.includes(member.club)) {
                    clubSelect.value = member.club;
                } else {
                    clubSelect.value = '';
                }

                studentIdInput.readOnly = true;
                studentIdInput.classList.add('bg-gray-100', 'cursor-not-allowed');
            } else {
                modalTitle.innerText = 'เพิ่มสมาชิกใหม่';
                submitButton.innerText = 'เพิ่มสมาชิก';
                submitButton.onclick = () => saveMember(null);

                studentIdInput.value = '';
                titlePrefixSelect.value = 'นาย';
                firstNameInput.value = '';
                lastNameInput.value = '';
                if (gradeList.length > 0) {
                    gradeSelect.value = gradeList[0];
                    updateMajorOptions();
                    const gradeType = gradeList[0].split('.')[0].trim();
                    if (majorList[gradeType] && majorList[gradeType].length > 0) {
                        majorSelect.value = majorList[gradeType][0];
                    }
                }
                clubSelect.value = '';
            }
            modal.classList.remove('hidden');
        }

        window.handleEdit = function(studentId) {
            const memberToEdit = membersData.find(member => member.studentId === studentId);
            if (memberToEdit) {
                openModal(memberToEdit);
            }
        }

        window.handleDelete = async function(studentId) {
            if (confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบสมาชิกที่มีรหัส ${studentId}?`)) {
                try {
                    await fetch(`/api/members/${studentId}`, { method: 'DELETE' });
                    alert("ลบสมาชิกเรียบร้อยแล้ว");
                    fetchAllData();
                } catch (error) {
                    alert("เกิดข้อผิดพลาดในการลบสมาชิก: " + error.message);
                }
            }
        }

        window.saveMember = async function(oldStudentId) {
            const studentId = document.getElementById('studentId').value.trim();
            const titlePrefix = document.getElementById('titlePrefix').value.trim();
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const grade = document.getElementById('grade').value.trim();
            const major = document.getElementById('major').value.trim();
            const club = document.getElementById('club').value.trim();
            const modalMessage = document.getElementById('modal-message');

            if (!studentId || !firstName || !lastName || !grade || !major || !club) {
                modalMessage.innerText = 'กรุณากรอกข้อมูลและเลือกชมรมให้ครบถ้วน';
                modalMessage.classList.add('text-red-500');
                return;
            }

            const fullName = `${firstName} ${lastName}`.trim();
            const member = { studentId, titlePrefix, name: fullName, grade, major, club };

            try {
                if (!oldStudentId) {
                    const existingMember = membersData.find(m => m.studentId === studentId);
                    if (existingMember) {
                        modalMessage.innerText = 'รหัสนักศึกษาซ้ำ กรุณาใช้รหัสอื่น';
                        modalMessage.classList.add('text-red-500');
                        return;
                    }
                }

                await fetch('/api/members', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(member)
                });

                modalMessage.innerText = oldStudentId ? 'บันทึกการแก้ไขเรียบร้อย' : 'เพิ่มสมาชิกเรียบร้อย';
                modalMessage.classList.remove('text-red-500');
                modalMessage.classList.add('text-green-500');
                setTimeout(() => { closeModal(); fetchAllData(); }, 1000);
            } catch (error) {
                modalMessage.innerText = 'เกิดข้อผิดพลาดในการบันทึก: ' + error.message;
                modalMessage.classList.add('text-red-500');
            }
        }

        window.closeModal = function() {
            document.getElementById('member-modal').classList.add('hidden');
        }

        let isTransitioning = false;

        window.addEventListener('scroll', () => {
            if (isTransitioning) return;

            const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
            const overscroll = window.scrollY - maxScroll;

            const trigger = document.getElementById('super-admin-trigger');

            if (overscroll > 0) {

                const pullProgress = Math.min(overscroll / 40, 1);

                const stretchY = overscroll * 0.4;
                const scale = 1 + (pullProgress * 0.15);
                const letterSpacing = pullProgress * 3;

                trigger.style.transform = `translateY(${stretchY}px) scale(${scale})`;
                trigger.style.letterSpacing = `${letterSpacing}px`;
                trigger.style.opacity = 0.5 + (pullProgress * 0.5);

                if (pullProgress > 0.5) {
                    trigger.innerText = "ปล่อยเพื่อเข้าสู่ระบบขั้นสูง";
                    trigger.classList.add('text-indigo-600');
                    trigger.classList.remove('text-gray-400');

                    document.body.style.backgroundColor = `rgba(243, 244, 246, ${1 - (pullProgress * 0.6)})`;
                } else {
                    trigger.innerText = "ดึงเพื่อเข้าสู่พื้นที่จัดการระบบขั้นสูง";
                    trigger.classList.add('text-gray-400');
                    trigger.classList.remove('text-indigo-600');
                    document.body.style.backgroundColor = '';
                }

                if (overscroll > 40 && !isTransitioning) {
                    isTransitioning = true;

                    trigger.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    trigger.style.transform = `translateY(${stretchY + 100}px) scale(2)`;
                    trigger.style.opacity = '0';

                    document.body.style.transition = 'background-color 0.8s ease-in, opacity 0.6s ease-out 0.4s';
                    document.body.style.backgroundColor = '#0f172a';

                    setTimeout(() => {
                        document.body.style.opacity = '0';
                        setTimeout(() => {
                            window.location.href = 'superadmin/index (1).html';
                        }, 600);
                    }, 200);
                }
            } else {
                trigger.style.transform = 'translateY(0) scale(1)';
                trigger.style.letterSpacing = 'normal';
                trigger.style.opacity = '0.5';
                document.body.style.backgroundColor = '';
            }
        }, { passive: true });

        window.addEventListener('wheel', (e) => {
            if (isTransitioning) {
                e.preventDefault();
            }
        }, { passive: false });

        window.exportToExcel = async function() {
            if (membersData.length === 0) {
                alert("ไม่มีข้อมูลสมาชิกให้ Export");
                return;
            }

            try {

                const btn = document.querySelector('button[onclick="exportToExcel()"]');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span class="text-indigo-600 font-bold">กำลังสร้างไฟล์...</span>';
                btn.disabled = true;

                const workbook = new ExcelJS.Workbook();
                workbook.creator = 'ระบบจัดการชมรม';
                workbook.created = new Date();

                dynamicClubList.forEach(clubName => {
                    const clubMembers = membersData.filter(m => m.club === clubName);
                    if (clubMembers.length === 0) return;

                    clubMembers.sort((a, b) => a.studentId.localeCompare(b.studentId));

                    const clubActivities = Object.keys(activitiesData)
                        .map(key => ({ id: key, ...activitiesData[key] }))
                        .filter(act => act.club === clubName)
                        .sort((a, b) => new Date(a.date) - new Date(b.date));

                    let sheetName = clubName.replace(/[\\/?*[\]:]/g, '').substring(0, 31);
                    const worksheet = workbook.addWorksheet(sheetName);

                    const defaultHeaders = [
                        { header: 'ลำดับ', key: 'index', width: 8 },
                        { header: 'รหัสนักศึกษา', key: 'studentId', width: 15 },
                        { header: 'คำนำหน้า', key: 'titlePrefix', width: 12 },
                        { header: 'ชื่อ-นามสกุล', key: 'name', width: 25 },
                        { header: 'ชั้นปี', key: 'grade', width: 10 },
                        { header: 'สาขาวิชา', key: 'major', width: 35 },
                        { header: 'ชมรม', key: 'club', width: 30 }
                    ];

                    const attendanceHeaders = clubActivities.map(act => ({
                        header: act.date,
                        key: act.id,
                        width: 15
                    }));

                    const summaryHeaders = [
                        { header: 'รวม ขาด (ครั้ง)', key: 'summary_absent', width: 15 },
                        { header: 'รวม ลา (ครั้ง)', key: 'summary_leave', width: 15 },
                        { header: 'สถานะ', key: 'summary_status', width: 15 }
                    ];

                    worksheet.columns = [...defaultHeaders, ...attendanceHeaders, ...summaryHeaders];

                    const headerRow = worksheet.getRow(1);
                    headerRow.height = 25;
                    headerRow.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 12 };
                    headerRow.alignment = { vertical: 'middle', horizontal: 'center' };

                    headerRow.eachCell((cell) => {
                        cell.fill = {
                            type: 'pattern',
                            pattern: 'solid',
                            fgColor: { argb: 'FF4F46E5' }
                        };
                        cell.border = {
                            top: {style:'thin', color: {argb:'FF3730A3'}},
                            left: {style:'thin', color: {argb:'FF3730A3'}},
                            bottom: {style:'thin', color: {argb:'FF3730A3'}},
                            right: {style:'thin', color: {argb:'FF3730A3'}}
                        };
                    });

                    clubMembers.forEach((member, idx) => {
                        const rowData = {
                            index: idx + 1,
                            studentId: member.studentId,
                            titlePrefix: member.titlePrefix,
                            name: member.name,
                            grade: member.grade,
                            major: member.major,
                            club: member.club
                        };

                        let absentCount = 0;
                        let leaveCount = 0;

                        clubActivities.forEach(act => {
                            const status = attendanceData[act.id] && attendanceData[act.id][member.studentId]
                                ? attendanceData[act.id][member.studentId]
                                : "ไม่มา";
                            rowData[act.id] = status;

                            if (status === "ขาด" || status === "ไม่มา") absentCount++;
                            if (status === "ลา") leaveCount++;
                        });

                        const totalAbsences = absentCount + Math.floor(leaveCount / 3);
                        const isFailed = totalAbsences > 5;

                        rowData['summary_absent'] = absentCount;
                        rowData['summary_leave'] = leaveCount;
                        rowData['summary_status'] = isFailed ? 'ไม่ผ่าน' : 'ผ่าน';

                        const row = worksheet.addRow(rowData);
                        row.height = 20;

                        row.eachCell((cell, colNumber) => {
                            cell.border = {
                                top: {style:'thin', color: {argb:'FFEEEEEE'}},
                                left: {style:'thin', color: {argb:'FFEEEEEE'}},
                                bottom: {style:'thin', color: {argb:'FFEEEEEE'}},
                                right: {style:'thin', color: {argb:'FFEEEEEE'}}
                            };
                            cell.alignment = { vertical: 'middle' };

                            if (colNumber === 1 || colNumber === 2 || colNumber === 5 || colNumber >= defaultHeaders.length + attendanceHeaders.length + 1) {
                                cell.alignment.horizontal = 'center';
                            }

                            if (colNumber > defaultHeaders.length && colNumber <= defaultHeaders.length + attendanceHeaders.length) {
                                cell.alignment.horizontal = 'center';
                                cell.font = { bold: true };
                                if (cell.value === 'มา') {
                                    cell.font.color = { argb: 'FF16A34A' };
                                } else if (cell.value === 'ลา') {
                                    cell.font.color = { argb: 'FFEAB308' };
                                } else if (cell.value === 'ขาด' || cell.value === 'ไม่มา') {
                                    cell.font.color = { argb: 'FFDC2626' };
                                }
                            }
                        });

                        const statusColNum = defaultHeaders.length + attendanceHeaders.length + 3;
                        const statusCell = row.getCell(statusColNum);
                        statusCell.font = { bold: true };

                        if (isFailed) {
                            statusCell.font.color = { argb: 'FFDC2626' };

                            row.getCell(4).font = { strike: true, color: { argb: 'FFDC2626' } };
                        } else {
                            statusCell.font.color = { argb: 'FF16A34A' };
                        }
                    });
                });

                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

                const today = new Date();
                const dateStr = today.toLocaleDateString('th-TH').replace(/\//g, '-');
                saveAs(blob, `ข้อมูลสมาชิกชมรม_${dateStr}.xlsx`);

                btn.innerHTML = originalText;
                btn.disabled = false;

            } catch (error) {
                console.error("Export Error:", error);
                alert("เกิดข้อผิดพลาดในการสร้างไฟล์ Excel");
                const btn = document.querySelector('button[onclick="exportToExcel()"]');
                if (btn) {
                    btn.innerHTML = 'ส่งออก Excel';
                    btn.disabled = false;
                }
            }
        };
        fetchAllData();
</script>

            break-inside: avoid-column;
        }
