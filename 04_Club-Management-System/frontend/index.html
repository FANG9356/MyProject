<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายชื่อสมาชิกชมรม</title>
    <script src="https://cdn.tailwindcss.com">
</script>
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_bAZkqDNIPIpN-E0ajt3jC6rSv0WUTZaC1Q&s">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }
        .club-container { break-inside: avoid-column; }
</style>

    
    <script src="auth.js">
</script>
    <script>blockDevTools();
</script>

</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-7xl mx-auto">
        
        <nav class="bg-white shadow-sm border border-gray-200 mb-8 rounded-2xl px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <img src="https://rms.utc.ac.th/files/01013_1809190994117.png" alt="Logo" class="h-10 w-10 rounded-full shadow-sm">
                <span class="text-xl font-bold text-indigo-700">ระบบจัดการชมรม</span>
            </div>
            <div class="flex flex-wrap justify-center gap-2">
                <a href="index.html" class="px-4 py-2 bg-indigo-50 text-indigo-700 font-semibold rounded-lg transition-colors text-sm shadow-sm">หน้าหลัก</a>
                <a href="register.html" class="px-4 py-2 text-gray-600 font-semibold rounded-lg hover:bg-gray-100 hover:text-indigo-600 transition-colors text-sm">ลงทะเบียน</a>
                <a href="statusattendance.html" class="px-4 py-2 text-gray-600 font-semibold rounded-lg hover:bg-gray-100 hover:text-indigo-600 transition-colors text-sm">เช็คสถานะการเข้าชมรม</a>
                <a href="admin.html" class="px-4 py-2 text-gray-600 font-semibold rounded-lg hover:bg-gray-100 hover:text-indigo-600 transition-colors text-sm">ระบบแอดมิน</a>
            </div>
        </nav>

        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                รายชื่อสมาชิกทั้งหมดแยกตามชมรม
            </h1>
        </div>
        <div class="columns-1 md:columns-2 lg:columns-3 gap-6" id="clubs-display-area">
            <div class="col-span-full text-center py-10">
                <p class="text-gray-500">กำลังโหลดข้อมูล...</p>
            </div>
        </div>
    </div>
    
    <script>let dynamicClubList = [];
        let membersData = [];
        let clubsStatusData = {};

        function renderMembers(members) {
            members.sort((a, b) => a.name.localeCompare(b.name, 'th'));
            if (members.length === 0) {
                return '<p class="text-gray-400 text-center py-4 italic">ยังไม่มีสมาชิกในชมรมนี้</p>';
            }
            return members.map((member, index) => `
                <div class="flex items-center justify-between p-3 border-b border-gray-100 last:border-b-0 hover:bg-gray-50 transition-colors">
                    <span class="text-gray-400 font-medium w-8 text-sm">${index + 1}</span>
                    <div class="flex-grow">
                        <p class="text-sm font-semibold text-gray-700">${member.titlePrefix}${member.name}</p>
                        <p class="text-xs text-gray-500">${member.grade} | ${member.major}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderClubs() {
            const container = document.getElementById('clubs-display-area');
            container.innerHTML = '';

            if (dynamicClubList.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10">ยังไม่มีรายชื่อชมรมในระบบ</div>';
                return;
            }

            dynamicClubList.forEach(clubName => {
                const clubMembers = membersData[clubName] || [];
                const isActive = clubsStatusData[clubName] === true;

                const closedBadge = !isActive
                    ? '<span class="bg-rose-100 text-rose-600 text-[10px] font-bold px-2 py-0.5 rounded-full ml-2 border border-rose-200">ปิดชั่วคราว</span>'
                    : '';

                const cardHtml = `
                    <div class="bg-white rounded-2xl shadow-sm border ${isActive ? 'border-gray-200' : 'border-rose-200'} mb-6 club-container overflow-hidden">
                        <div class="${isActive ? 'bg-indigo-50 border-indigo-100' : 'bg-rose-50 border-rose-100'} px-4 py-3 border-b flex justify-between items-center">
                            <div class="flex items-center flex-wrap gap-1">
                                <h2 class="text-lg font-bold ${isActive ? 'text-indigo-800' : 'text-rose-800'}">${clubName}</h2>
                                ${closedBadge}
                            </div>
                            <span class="${isActive ? 'bg-indigo-100 text-indigo-700' : 'bg-rose-100 text-rose-700'} text-xs font-bold px-2 py-1 rounded-full whitespace-nowrap shadow-sm">${clubMembers.length} คน</span>
                        </div>
                        <div class="p-2">
                            ${renderMembers(clubMembers)}
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        async function fetchData() {
            try {
                const clubsRes = await fetch('/api/clubs');
                clubsStatusData = await clubsRes.json();
                dynamicClubList = Object.keys(clubsStatusData).sort();

                const membersRes = await fetch('/api/publicMembers');
                membersData = await membersRes.json();

                renderClubs();
            } catch (error) {
                console.error("Error fetching data: ", error);
                document.getElementById('clubs-display-area').innerHTML = `<p class="text-red-500 text-center">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>`;
            }
        }

        fetchData();
</script>
</body>
</html>
