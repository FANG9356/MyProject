<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>System Monitor Station</title>
    <style>body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 50px; }
        .card { background: #2d2d2d; border-radius: 15px; padding: 20px; margin: 20px auto; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #00d2ff; }
        .stat-box { display: flex; justify-content: space-around; margin-top: 20px; }
        .stat-item { font-size: 1.2em; }
        .value { font-size: 2.5em; font-weight: bold; color: #00d2ff; }
        .unit { font-size: 0.5em; color: #888; }
        #client-ip { color: #ff0055; font-weight: bold; }
</style>
</head>
<body>
    <h1> System Monitor Station</h1>
    <p>โปรแกรมตรวจสอบสถานะเครื่อง (รันโดยไม่ต้องติดตั้ง)</p>

    <div class="card">
        <h3> เครื่องที่คุณกำลังใช้งาน</h3>
        <p id="os-info">Loading System...</p>
        <p>Client IP: <span id="client-ip">...</span></p>
    </div>

    <div class="card">
        <div class="stat-box">
            <div class="stat-item">
                <div>CPU Load</div>
                <div class="value"><span id="cpu">0</span><span class="unit">%</span></div>
            </div>
            <div class="stat-item">
                <div>RAM Usage</div>
                <div class="value"><span id="ram">0</span><span class="unit">%</span></div>
                <div style="font-size: 0.8em; color: gray;">of <span id="ram-total">0</span> GB</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js">
</script>
    <script>const socket = io();
        socket.on('your-ip', (ip) => document.getElementById('client-ip').innerText = ip);
        socket.on('dashboard-update', (data) => {
            document.getElementById('os-info').innerText = data.os;
            document.getElementById('cpu').innerText = data.cpu;
            document.getElementById('ram').innerText = data.ram;
            document.getElementById('ram-total').innerText = data.ramTotal;
        });
</script>
</body>
</html>
