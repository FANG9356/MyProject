services:
  backend:
    image: python:3.11-slim
    working_dir: /code
    volumes:
      - ./app:/code
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && 
             uvicorn main:app --host 0.0.0.0 --port 8000"
  frontend:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000 
    command: >
      sh -c "npm install && 
             npm run dev -- --host"